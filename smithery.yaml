# Smithery.ai configuration for container-based deployments
runtime: container
build:
  dockerfile: Dockerfile
  dockerBuildPath: .
startCommand:
  type: http
  endpoint: /smithery
  method: POST
tools:
  - query_technique
  - search_technique_full
  - list_tactics
  - query_mitigations
  - query_detections
  - server_info
